spring.application.name=motiva-api

spring.datasource.url=jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL
spring.datasource.username=${DB_USER:seu_rm}
spring.datasource.password=${DB_PASSWORD:sua_senha_aqui}

# As tabelas ja existem (Sprint 3): o Hibernate nao deve criar nem alterar nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
